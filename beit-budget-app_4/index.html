/* ============================================================
   Excel export — a real .xlsx, written by hand (stored-ZIP + OOXML)
   ============================================================ */
const CRC=(()=>{ const t=new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[i]=c>>>0; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const te=new TextEncoder(), parts=[], central=[]; let off=0;
  files.forEach(f=>{
    const data = typeof f.data==="string" ? te.encode(f.data) : f.data;
    const name = te.encode(f.name), crc=crc32(data);
    const lh=new Uint8Array(30+name.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true);
    dv.setUint16(26,name.length,true);
    lh.set(name,30);
    parts.push(lh,data);
    const ch=new Uint8Array(46+name.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint32(42,off,true);
    ch.set(name,46);
    central.push(ch);
    off += lh.length + data.length;
  });
  const cdSize=central.reduce((s,c)=>s+c.length,0);
  const eocd=new Uint8Array(22), ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,off,true);
  return new Blob([...parts,...central,eocd],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function xe(s){ return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,""); }
function colName(i){ let s=""; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-m-1)/26; } return s; }
function sheetXML(rows){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((r,ri)=>{
    x+='<row r="'+(ri+1)+'">';
    r.forEach((v,ci)=>{
      if(v===null||v===undefined||v==="") return;
      const ref=colName(ci)+(ri+1);
      if(typeof v==="number" && isFinite(v)) x+='<c r="'+ref+'"><v>'+v+'</v></c>';
      else x+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xe(v)+'</t></is></c>';
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}
function buildWorkbook(sheets){
  const files=[
    {name:"[Content_Types].xml", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")+
      '</Types>'},
    {name:"_rels/.rels", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:"xl/workbook.xml", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
      sheets.map((s,i)=>'<sheet name="'+xe(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")+
      '</sheets></workbook>'},
    {name:"xl/_rels/workbook.xml.rels", data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")+
      '</Relationships>'}
  ];
  sheets.forEach((s,i)=> files.push({name:"xl/worksheets/sheet"+(i+1)+".xml", data:sheetXML(s.rows)}));
  return zipStore(files);
}
async function exportXLSX(){
  const months=[]; for(let i=0;i<12;i++) months.push(ymAdd(model.startMonth,i));
  const fc=forecast();

  const setup=[["Monthly Budget Setup"],[],
    ["Category","Description","Classification","Optimization Group","Monthly Amount ($)","Yearly Equivalent ($)","% of Income","Your Cut %","Notes"]];
  usedCats().forEach(cat=>{
    model.lines.filter(l=>l.cat===cat).forEach(l=>setup.push([l.cat,l.name,l.cls,l.grp,num(l.amount),num(l.amount)*12,
      totalIncome()?num(l.amount)/totalIncome():0, num(l.cut), l.note||""]));
    setup.push([cat+" TOTAL","","","",catBudget(cat),catBudget(cat)*12,"","",""]);
  });
  setup.push([]);
  setup.push(["TOTAL EXPENSES","","","",totalBudget(),totalBudget()*12]);
  setup.push(["MONTHLY SURPLUS","","","",totalIncome()-totalBudget()]);
  setup.push([]);
  setup.push(["Assumptions"]);
  [["Income",model.income],["Extra Income",model.extraIncome],["Total Monthly Income",totalIncome()],
   ["Starting Cash Savings",num(model.startCash)],["Starting Debt Balance",num(model.startDebt)],
   ["Savings Goal Amount",num(model.goalAmount)],["Goal Timeframe (months)",num(model.goalMonths)],
   ["Budget Start Month",model.startMonth],["LBP per USD",num(model.lbpRate)],
   ["Discretionary Cut %",num(model.levers.Discretionary)],["Fuel Cut %",num(model.levers.Fuel)],
   ["Groceries Cut %",num(model.levers.Groceries)]].forEach(r=>setup.push(r));

  const log=[["Expense Log"],[],["Date","Line Item","Description","Amount ($)","Month","Logged by","Source","Currency","Original amount"]];
  const all=[];
  months.forEach(ym=>{
    autoPosted(ym).forEach(l=> all.push({date:ym+"-01", lineId:l.id, desc:"Auto: recurring fixed expense",
      amount:num(l.amount), month:ym, by:"auto", kind:"recurring", ccy:"USD", raw:num(l.amount)}));
  });
  entries.forEach(e=>all.push(e));
  all.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(e=>{
    const l=lineById(e.lineId);
    log.push([e.date, lineLabel(l), e.desc||"", Math.round(num(e.amount)*100)/100,
      ymLabel(e.month,false).replace(" ","-"), e.by||"", e.kind||"manual", e.ccy||"USD", num(e.raw||e.amount)]);
  });

  const track=[["Monthly Tracking: budget vs. actual"],[],
    ["Line Item","Category","Monthly Budget"].concat(months.map(m=>ymLabel(m,false).replace(" ","-")))];
  const spent=months.map(m=>spentByLine(m));
  usedCats().forEach(cat=>{
    model.lines.filter(l=>l.cat===cat).forEach(l=>
      track.push([lineLabel(l), l.cat, num(l.amount)].concat(spent.map(s=>s[l.id]||0))));
    track.push([cat+" TOTAL","",catBudget(cat)].concat(spent.map(s=>
      model.lines.filter(l=>l.cat===cat).reduce((a,l)=>a+(s[l.id]||0),0))));
  });
  track.push(["ALL SPENDING","",totalBudget()].concat(months.map(m=>spentTotal(m))));

  const fcr=[["36-Month Cash & Debt Forecast"],[],
    ["Month #","Calendar Month","Baseline Surplus","Baseline Debt","Baseline Cash",
     "Optimized Cash","Custom Cash"]];
  fc.base.forEach((r,i)=> fcr.push([i, ymLabel(r.ym,false).replace(" ","-"),
    i?Math.round(r.surplus):"", Math.round(r.debt), Math.round(r.cash),
    Math.round(fc.opt[i].cash), Math.round(fc.cus[i].cash)]));

  const blob=buildWorkbook([
    {name:"Budget Setup", rows:setup},
    {name:"Expense Log", rows:log},
    {name:"Monthly Tracking", rows:track},
    {name:"Forecast", rows:fcr}
  ]);
  await offer("Household_Budget_"+new Date().toISOString().slice(0,10)+".xlsx", blob);
}
